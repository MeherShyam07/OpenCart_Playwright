name: Playwright Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      test_suite:
        description: Select one suite or run every supported suite
        type: choice
        options:
          - All Suites
          - test:web
          - test:datadriven
          - test:api
          - test:api-contract
          - test:db
          - test:master
          - test:sanity
          - test:regression
          - test:e2e
        default: All Suites
        required: true

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript validation
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

  web:
    name: Web UI
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["All Suites","test:web","test:master","test:sanity","test:regression","test:e2e"]'), inputs.test_suite) }}
    needs: typecheck
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "1"
      WEB_APP_URL: ${{ vars.OPENCART_WEB_APP_URL || 'https://awesomeqa.com/ui/' }}
      APP_EMAIL: ${{ secrets.OPENCART_CUSTOMER_EMAIL }}
      APP_PASSWORD: ${{ secrets.OPENCART_CUSTOMER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Create CI environment file
        run: Copy-Item .env.example .env

      - name: Validate OpenCart configuration and runner access
        shell: pwsh
        run: |
          $missing = @('WEB_APP_URL', 'APP_EMAIL', 'APP_PASSWORD') | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Configure the OpenCart URL variable and customer-login secrets before running web tests. Missing values: $($missing -join ', ')."
          }

          $uri = [Uri]$env:WEB_APP_URL
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted' -and
              $uri.IsLoopback) {
            throw 'A GitHub-hosted runner cannot reach an OpenCart URL on your laptop. Configure OPENCART_WEB_APP_URL with a runner-reachable application URL.'
          }

          try {
            $response = Invoke-WebRequest -Uri $env:WEB_APP_URL -TimeoutSec 30 -MaximumRedirection 5 -UseBasicParsing
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "OpenCart returned HTTP $($response.StatusCode)."
            }
          } catch {
            throw "The runner could not load WEB_APP_URL. Check OPENCART_WEB_APP_URL, network access, and application availability. $($_.Exception.Message)"
          }

      - name: Run Web UI tests
        shell: pwsh
        run: |
          $suite = '${{ inputs.test_suite || 'All Suites' }}'
          $grep = '@web'
          if ($suite -eq 'test:master') { $grep = '(?=.*@web)(?=.*@master)' }
          if ($suite -eq 'test:sanity') { $grep = '(?=.*@web)(?=.*@sanity)' }
          if ($suite -eq 'test:regression') { $grep = '(?=.*@web)(?=.*@regression)' }
          if ($suite -eq 'test:e2e') { $grep = '(?=.*@web)(?=.*@end-to-end)' }
          npx playwright test --grep "$grep" --grep-invert '@datadriven' --project=chromium --output=test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanitize test diagnostics before upload
        if: always()
        shell: pwsh
        run: ./utils/sanitize-playwright-artifacts.ps1

      - name: Upload Playwright diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-results
          path: |
            test-results/**/*.md
            reports/results.xml
            custom-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 7

  datadriven:
    name: Data-driven login
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["All Suites","test:web","test:datadriven","test:master","test:regression"]'), inputs.test_suite) }}
    needs: typecheck
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "1"
      WEB_APP_URL: ${{ vars.OPENCART_WEB_APP_URL || 'https://awesomeqa.com/ui/' }}
      APP_EMAIL: ${{ secrets.OPENCART_CUSTOMER_EMAIL }}
      APP_PASSWORD: ${{ secrets.OPENCART_CUSTOMER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Create CI environment file
        run: Copy-Item .env.example .env

      - name: Validate OpenCart configuration and runner access
        shell: pwsh
        run: |
          $missing = @('WEB_APP_URL', 'APP_EMAIL', 'APP_PASSWORD') | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Configure the OpenCart URL variable and customer-login secrets before running data-driven tests. Missing values: $($missing -join ', ')."
          }

          $uri = [Uri]$env:WEB_APP_URL
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted' -and $uri.IsLoopback) {
            throw 'A GitHub-hosted runner cannot reach an OpenCart URL on your laptop. Configure OPENCART_WEB_APP_URL with a runner-reachable application URL.'
          }

          try {
            $response = Invoke-WebRequest -Uri $env:WEB_APP_URL -TimeoutSec 30 -MaximumRedirection 5 -UseBasicParsing
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "OpenCart returned HTTP $($response.StatusCode)."
            }
          } catch {
            throw "The runner could not load WEB_APP_URL. Check OPENCART_WEB_APP_URL, network access, and application availability. $($_.Exception.Message)"
          }

      - name: Run data-driven login tests
        run: npm run test:datadriven -- --project=chromium --output=test-results

      - name: Sanitize test diagnostics before upload
        if: always()
        shell: pwsh
        run: ./utils/sanitize-playwright-artifacts.ps1

      - name: Upload Playwright diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadriven-playwright-results
          path: |
            test-results/**/*.md
            reports/results.xml
            custom-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: Live API
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["All Suites","test:api","test:master","test:sanity","test:regression"]'), inputs.test_suite) }}
    needs: typecheck
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "1"
      API_BASE_URL: ${{ vars.FAKESTORE_API_BASE_URL || 'https://fakestoreapi.com' }}
      FAKESTORE_USERNAME: ${{ secrets.FAKESTORE_USERNAME }}
      PASSWORD: ${{ secrets.FAKESTORE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create CI environment file
        run: Copy-Item .env.example .env

      - name: Validate API configuration
        shell: pwsh
        run: |
          $missing = @('API_BASE_URL', 'FAKESTORE_USERNAME', 'PASSWORD') | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Configure the FAKESTORE_API_BASE_URL variable and API login secrets before running live API tests. Missing values: $($missing -join ', ')."
          }

      - name: Run live API tests
        shell: pwsh
        run: |
          $suite = '${{ inputs.test_suite || 'All Suites' }}'
          $grep = '@api'
          if ($suite -eq 'test:master') { $grep = '@master' }
          if ($suite -eq 'test:sanity') { $grep = '@sanity' }
          if ($suite -eq 'test:regression') { $grep = '@regression' }
          npx playwright test --grep "$grep" --grep-invert '@api-contract' --project=chromium --output=test-results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sanitize test diagnostics before upload
        if: always()
        shell: pwsh
        run: ./utils/sanitize-playwright-artifacts.ps1

      - name: Upload Playwright diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-results
          path: |
            test-results/
            reports/results.xml
            custom-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 7

  api-contract:
    name: API contract
    if: ${{ github.event_name != 'workflow_dispatch' || contains(fromJSON('["All Suites","test:api-contract","test:master","test:regression"]'), inputs.test_suite) }}
    needs: typecheck
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Create CI environment file
        run: Copy-Item .env.example .env

      - name: Run API contract tests
        run: npm run test:api-contract -- --project=chromium --output=test-results

      - name: Sanitize test diagnostics before upload
        if: always()
        shell: pwsh
        run: ./utils/sanitize-playwright-artifacts.ps1

      - name: Upload Playwright diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-contract-playwright-results
          path: |
            test-results/
            reports/results.xml
            custom-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 7

  database:
    name: OpenCart database integration
    if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["All Suites","test:db"]'), inputs.test_suite) }}
    needs: typecheck
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "1"
      WEB_APP_URL: ${{ vars.OPENCART_WEB_APP_URL || 'https://awesomeqa.com/ui/' }}
      ADMIN_USERNAME: ${{ secrets.OPENCART_ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.OPENCART_ADMIN_PASSWORD }}
      DB_HOST: ${{ vars.OPENCART_DB_HOST }}
      DB_PORT: ${{ vars.OPENCART_DB_PORT }}
      DB_USER: ${{ secrets.OPENCART_DB_USER }}
      DB_PASSWORD: ${{ secrets.OPENCART_DB_PASSWORD }}
      DB_NAME: ${{ vars.OPENCART_DB_NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Create CI environment file
        run: Copy-Item .env.example .env

      - name: Validate OpenCart and database configuration
        shell: pwsh
        run: |
          $required = @('WEB_APP_URL', 'ADMIN_USERNAME', 'ADMIN_PASSWORD', 'DB_HOST', 'DB_PORT', 'DB_USER', 'DB_PASSWORD', 'DB_NAME')
          $missing = $required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          }
          if ($missing.Count -gt 0) {
            throw "Configure the OpenCart URL, admin-login secrets, and database connection settings before running the database suite. Missing values: $($missing -join ', ')."
          }

          $uri = [Uri]$env:WEB_APP_URL
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted' -and $uri.IsLoopback) {
            throw 'A GitHub-hosted runner cannot reach an OpenCart URL on your laptop. Configure OPENCART_WEB_APP_URL with a runner-reachable application URL.'
          }
          if ($env:RUNNER_ENVIRONMENT -eq 'github-hosted' -and $env:DB_HOST -in @('localhost', '127.0.0.1', '::1')) {
            throw 'A GitHub-hosted runner cannot reach MySQL on your laptop. Configure OPENCART_DB_HOST with a runner-reachable database host.'
          }

          try {
            $response = Invoke-WebRequest -Uri $env:WEB_APP_URL -TimeoutSec 30 -MaximumRedirection 5 -UseBasicParsing
            if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 400) {
              throw "OpenCart returned HTTP $($response.StatusCode)."
            }
          } catch {
            throw "The runner could not load WEB_APP_URL. Check OPENCART_WEB_APP_URL, network access, and application availability. $($_.Exception.Message)"
          }

          $port = [int]$env:DB_PORT
          $connection = [System.Net.Sockets.TcpClient]::new()
          try {
            $connect = $connection.BeginConnect($env:DB_HOST, $port, $null, $null)
            if (-not $connect.AsyncWaitHandle.WaitOne(10000)) {
              throw "Timed out connecting to the configured MySQL host on port $port."
            }
            $connection.EndConnect($connect)
          } finally {
            $connection.Dispose()
          }

      - name: Verify MySQL credentials and OpenCart schema
        shell: pwsh
        run: |
          node -e "const mysql=require('mysql2/promise'); (async()=>{const c=await mysql.createConnection({host:process.env.DB_HOST,port:Number(process.env.DB_PORT),user:process.env.DB_USER,password:process.env.DB_PASSWORD,database:process.env.DB_NAME});try{await c.query('SELECT firstname, lastname, email, status, date_added FROM oc_customer LIMIT 0')}finally{await c.end()}})().catch(e=>{console.error('MySQL preflight failed ('+(e.code||'connection error')+'). Verify database reachability, credentials, database name, and the oc_customer table.');process.exitCode=1})"

      - name: Run database integration test
        run: npm run test:db -- --project=chromium --output=test-results

      - name: Sanitize test diagnostics before upload
        if: always()
        shell: pwsh
        run: ./utils/sanitize-playwright-artifacts.ps1

      - name: Upload Playwright diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-playwright-results
          path: |
            test-results/**/*.md
            reports/results.xml
            custom-report/
            allure-results/
          if-no-files-found: ignore
          retention-days: 7
